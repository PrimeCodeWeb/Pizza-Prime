</head>
<body>

<h1 class="titulo">Seu Carrinho</h1>

<div id="listaCarrinho"></div>

<h2 id="total"></h2>

<button id="btnFinalizar">
    Finalizar Pedido
</button>

<script>

    // ==========================================
    // RECUPERAR CARRINHO
    // ==========================================

    const listaCarrinho =
        document.getElementById("listaCarrinho");

    const totalElemento =
        document.getElementById("total");

    const btnFinalizar =
        document.getElementById("btnFinalizar");


    let carrinho =
        JSON.parse(
            localStorage.getItem("carrinho")
        ) || [];


    // ==========================================
    // MOSTRAR CARRINHO
    // ==========================================

    function mostrarCarrinho() {

        listaCarrinho.innerHTML = "";

        let total = 0;


        if (carrinho.length === 0) {

            listaCarrinho.innerHTML = `
                <p style="
                    text-align:center;
                    font-size:18px;
                    margin:30px 0;
                ">
                    Seu carrinho está vazio 🍕
                </p>
            `;

            totalElemento.innerText =
                "Total: R$ 0,00";

            btnFinalizar.disabled = true;

            return;
        }


        carrinho.forEach((item, index) => {

            const preco =
                Number(item.preco) || 0;

            total += preco;


            const div =
                document.createElement("div");

            div.className = "item-carrinho";


            div.innerHTML = `

                <div>

                    <strong>
                        ${item.nome}
                    </strong>

                    <p>
                        R$ ${preco.toFixed(2).replace(".", ",")}
                    </p>

                </div>

                <button
                    onclick="removerItem(${index})"
                    style="
                        cursor:pointer;
                        padding:8px 12px;
                        border:none;
                        border-radius:8px;
                    "
                >
                    🗑️
                </button>

            `;


            listaCarrinho.appendChild(div);

        });


        totalElemento.innerText =
            `Total: R$ ${total.toFixed(2).replace(".", ",")}`;

    }


    // ==========================================
    // REMOVER ITEM
    // ==========================================

    function removerItem(index) {

        carrinho.splice(index, 1);

        localStorage.setItem(
            "carrinho",
            JSON.stringify(carrinho)
        );

        mostrarCarrinho();

    }


    // ==========================================
    // FINALIZAR PEDIDO
    // ==========================================

    btnFinalizar.addEventListener(
        "click",
        function () {

            if (carrinho.length === 0) {

                alert(
                    "Seu carrinho está vazio! 🍕"
                );

                return;
            }


            // Salva uma cópia específica
            // para a página de pagamento

            localStorage.setItem(
                "carrinhoPagamento",
                JSON.stringify(carrinho)
            );


            // Vai para o pagamento

            window.location.href =
                "pagamento.html";

        }
    );


    // ==========================================
    // INICIAR
    // ==========================================

    mostrarCarrinho();

</script>


</body>
</html>
