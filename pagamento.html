<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento - Pizza Prime</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px 15px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 30px;

    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitulo {

        margin-bottom: 30px;

        border-radius: 10px;
    }

    .item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #ddd;
    }

    .total {
        display: flex;
        justify-content: space-between;

        font-weight: bold;
    }

</style>
```

</head>

<body>

```
<div class="container">

    <h1>🍕 Finalizar Pedido</h1>

    <p class="subtitulo">
        Confira seu pedido e escolha a forma de pagamento.
    </p>

    <div id="resumoPedido"></div>

    <div id="paymentBrick_container"></div>

</div>

<script>

    // ==========================================
    // 1. RECUPERAR CARRINHO
    // ==========================================

    const carrinho =
        JSON.parse(
            localStorage.getItem("carrinhoPagamento")
        ) || [];


    if (carrinho.length === 0) {

        alert("Nenhum pedido encontrado.");

        window.location.href = "carrinho.html";

    }


    // ==========================================
    // 2. CALCULAR TOTAL
    // ==========================================

    let total = 0;

    carrinho.forEach(item => {

        total += Number(item.preco);

    });


    // ==========================================
    // 3. MOSTRAR RESUMO
    // ==========================================

    const resumo =
        document.getElementById("resumoPedido");


    carrinho.forEach(item => {

        resumo.innerHTML += `

            <div class="item">

                <span>
                    ${item.nome}
                </span>

                <strong>
                    R$ ${Number(item.preco).toFixed(2)}
                </strong>

            </div>

        `;

    });


    resumo.innerHTML += `

        <div class="total">

            <span>Total</span>

            <span>
                R$ ${total.toFixed(2)}
            </span>

        </div>

    `;


    // ==========================================
    // 4. MERCADO PAGO
    // ==========================================

    const mp = new MercadoPago(
        "TEST-f8a5c9f6-f4e3-4c57-88e0-a07daa33e4b8",
        {
            locale: "pt-BR"
        }
    );


    const bricksBuilder = mp.bricks();


    // ==========================================
    // 5. PAYMENT BRICK
    // ==========================================

    async function renderPaymentBrick() {

        const settings = {

            initialization: {

                amount: Number(
                    total.toFixed(2)
                )

            },

            customization: {

                paymentMethods: {

                    creditCard: "all",

                    debitCard: "all"

                }

            },

            callbacks: {

                onReady: () => {

                    console.log(
                        "✅ Payment Brick carregado!"
                    );

                },


                onSubmit: async ({
                    selectedPaymentMethod,
                    formData
                }) => {

                    console.log(
                        "=============================="
                    );

                    console.log(
                        "🍕 PAGAMENTO"
                    );

                    console.log(
                        "Método:",
                        selectedPaymentMethod
                    );

                    console.log(
                        "FormData recebido:",
                        formData
                    );


                    // ==========================================
                    // VERIFICAR TOKEN
                    // ==========================================

                    if (
                        (
                            selectedPaymentMethod === "credit_card" ||
                            selectedPaymentMethod === "debit_card"
                        )
                        &&
                        !formData.token
                    ) {

                        console.error(
                            "❌ TOKEN DO CARTÃO NÃO FOI GERADO."
                        );

                        console.log(
                            "FormData completo:",
                            formData
                        );

                        alert(
                            "Não foi possível gerar o token do cartão. Verifique os dados e tente novamente."
                        );

                        return;

                    }


                    // ==========================================
                    // GARANTIR VALOR CORRETO
                    // ==========================================

                    const dadosPagamento = {

                        ...formData,

                        transaction_amount:
                            Number(
                                total.toFixed(2)
                            ),

                        description:
                            "Pedido Pizza Prime"

                    };


                    console.log(
                        "Dados enviados para o servidor:",
                        dadosPagamento
                    );


                    try {

                        // ==========================================
                        // ENVIAR PARA O RENDER
                        // ==========================================

                        const response =
                            await fetch(
                                "/process_payment",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify(
                                            dadosPagamento
                                        )

                                }
                            );


                        console.log(
                            "Status HTTP:",
                            response.status
                        );


                        const result =
                            await response.json();


                        console.log(
                            "Resposta do servidor:",
                            result
                        );


                        // ==========================================
                        // PAGAMENTO APROVADO
                        // ==========================================

                        if (
                            result.status === "approved"
                        ) {

                            alert(
                                "Pagamento aprovado! 🎉🍕"
                            );


                            localStorage.removeItem(
                                "carrinho"
                            );


                            localStorage.removeItem(
                                "carrinhoPagamento"
                            );


                            window.location.href =
                                "index.html";

                            return;

                        }


                        // ==========================================
                        // PAGAMENTO PENDENTE
                        // ==========================================

                        if (
                            result.status === "pending"
                        ) {

                            alert(
                                "Pagamento pendente. Aguarde a confirmação."
                            );

                            return;

                        }


                        // ==========================================
                        // PAGAMENTO REJEITADO
                        // ==========================================

                        console.error(
                            "❌ Pagamento rejeitado:",
                            result
                        );


                        alert(
                            "Pagamento não aprovado.\n\n" +
                            (
                                result.status_detail ||
                                result.error ||
                                "Verifique os dados e tente novamente."
                            )
                        );

                    }


                    catch (error) {

                        console.error(
                            "❌ Erro ao processar pagamento:",
                            error
                        );


                        alert(
                            "Erro ao processar o pagamento."
                        );

                    }

                },


                onError: (error) => {

                    console.error(
                        "❌ Erro no Payment Brick:",
                        error
                    );

                }

            }

        };


        try {

            const paymentBrickController =
                await bricksBuilder.create(
                    "payment",
                    "paymentBrick_container",
                    settings
                );


            window.paymentBrickController =
                paymentBrickController;


            console.log(
                "✅ Payment Brick criado com sucesso!"
            );

        }

        catch (error) {

            console.error(
                "❌ Erro ao criar Payment Brick:",
                error
            );

        }

    }


    renderPaymentBrick();

</script>
```

</body>

</html>
