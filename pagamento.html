```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento - Pizza Prime</title>

    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        #resumoPedido {
            margin-bottom: 30px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        #paymentBrick_container {
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🍕 Finalizar Pedido</h1>

        <p class="subtitulo">
            Confira seu pedido e escolha a forma de pagamento.
        </p>

        <div id="resumoPedido"></div>

        <div id="paymentBrick_container"></div>

    </div>


    <script>

        // ==========================================
        // RECUPERA O CARRINHO
        // ==========================================

        const carrinho =
            JSON.parse(
                localStorage.getItem("carrinhoPagamento")
            ) || [];


        // ==========================================
        // VERIFICA SE EXISTE PEDIDO
        // ==========================================

        if (carrinho.length === 0) {

            alert("Nenhum pedido encontrado.");

            window.location.href = "carrinho.html";

        }


        // ==========================================
        // CALCULA O TOTAL
        // ==========================================

        let total = 0;

        carrinho.forEach(item => {

            total += Number(item.preco);

        });


        // ==========================================
        // MOSTRA RESUMO
        // ==========================================

        const resumo =
            document.getElementById("resumoPedido");


        carrinho.forEach(item => {

            resumo.innerHTML += `

                <div class="item">

                    <span>
                        ${item.nome}
                    </span>

                    <strong>
                        R$ ${Number(item.preco).toFixed(2)}
                    </strong>

                </div>

            `;

        });


        resumo.innerHTML += `

            <div class="total">

                <span>Total</span>

                <span>
                    R$ ${total.toFixed(2)}
                </span>

            </div>

        `;


        // ==========================================
        // MERCADO PAGO
        // ==========================================

        const mp =
            new MercadoPago(
                "TEST-f8a5c9f6-f4e3-4c57-88e0-a07daa33e4b8",
                {
                    locale: "pt-BR"
                }
            );


        const bricksBuilder =
            mp.bricks();


        // ==========================================
        // PAYMENT BRICK
        // ==========================================

        async function renderPaymentBrick() {

            const settings = {

                initialization: {

                    amount:
                        Number(
                            total.toFixed(2)
                        )

                },

                customization: {

                    paymentMethods: {

                        creditCard: "all",

                        debitCard: "all",

                        bankTransfer: "all"

                    }

                },

                callbacks: {

                    onReady: () => {

                        console.log(
                            "Payment Brick carregado! 🍕"
                        );

                    },


                    onSubmit: async ({
                        selectedPaymentMethod,
                        formData
                    }) => {

                        console.log(
                            "Método escolhido:",
                            selectedPaymentMethod
                        );

                        console.log(
                            "Dados:",
                            formData
                        );


                        try {

                            // IMPORTANTE:
                            // Não usar localhost aqui.
                            // O servidor é o próprio Render.

                            const response =
                                await fetch(
                                    "/process_payment",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify(
                                                formData
                                            )
                                    }
                                );


                            const result =
                                await response.json();


                            console.log(
                                "Resposta do servidor:",
                                result
                            );


                            if (
                                result.status ===
                                "approved"
                            ) {

                                alert(
                                    "Pagamento aprovado! 🎉🍕"
                                );


                                localStorage.removeItem(
                                    "carrinho"
                                );


                                localStorage.removeItem(
                                    "carrinhoPagamento"
                                );


                                window.location.href =
                                    "index.html";

                            }


                            else if (
                                result.status ===
                                "pending"
                            ) {

                                alert(
                                    "Pagamento pendente. Aguarde a confirmação."
                                );

                            }


                            else {

                                alert(
                                    "Pagamento não aprovado."
                                );

                                console.log(result);

                            }

                        }


                        catch (error) {

                            console.error(
                                "Erro ao processar pagamento:",
                                error
                            );


                            alert(
                                "Erro ao processar o pagamento."
                            );

                        }

                    },


                    onError: (error) => {

                        console.error(
                            "Erro no Payment Brick:",
                            error
                        );

                    }

                }

            };


            const paymentBrickController =
                await bricksBuilder.create(
                    "payment",
                    "paymentBrick_container",
                    settings
                );


            window.paymentBrickController =
                paymentBrickController;

        }


        renderPaymentBrick();

    </script>

</body>

</html>
```
